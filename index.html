<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#121214" id="theme-color-meta" />
    <meta name="description" content="CineTrack — Personal movie and TV tracking, watch logging, episode progression, and analytics." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192x192.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>CineTrack — Track. Rate. Remember.</title>
    <!-- Theme bootstrap script: runs synchronously before first paint to eliminate flash -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('cinetrack_theme');
          var theme = 'dark';
          if (saved === 'light' || saved === 'dark') {
            theme = saved;
          } else if (saved === 'system' || !saved) {
            theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.getElementById('theme-color-meta');
          if (meta) {
            meta.setAttribute('content', theme === 'dark' ? '#121214' : '#f5f5f7');
          }
        } catch (e) {
          /* ignore storage errors */
        }
      })();
    </script>
  </head>
  <body>
    <a href="#main-content" class="skip-to-content">Skip to content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
